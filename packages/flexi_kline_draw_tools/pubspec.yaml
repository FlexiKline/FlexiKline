resolution: workspace
name: flexi_kline_draw_tools
description: "Drawing tools for flexi_kline charts, including trend lines, Fibonacci retracements, parallel channels and more."
version: 2.6.0
homepage: "https://flexikline.github.io"
repository: "https://github.com/FlexiKline/FlexiKline/tree/main/packages/flexi_kline_draw_tools"
issue_tracker: "https://github.com/FlexiKline/FlexiKline/issues"
topics:
  - chart
  - kline
  - draw-tools
  - flexi-kline

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  flexi_kline: ^2.6.0
  equatable: ^2.0.8
  json_annotation: ^4.12.0
  copy_with_extension: ">=6.0.0 <18.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  flexi_formatter: ^2.0.1 # example/ only: TimeUnit for KlineSpec.interval

  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  copy_with_extension_gen: ">=6.0.0 <18.0.0"
