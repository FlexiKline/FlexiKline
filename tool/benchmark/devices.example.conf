# matrix.sh 的设备清单: 复制为同目录的 devices.conf(不入库; devices*.conf 都被忽略, 可按用途另存几份,
# 用 matrix.sh --devices 指定), 把占位符换成设备 id(`fvm flutter devices` 第二列)。
#
# 每行一个组合: <label> <device-id> <hz> <backend>
# - label: 结果目录里的设备名, 小写字母、数字与连字符;
# - hz: 采集前在手机上固定的刷新率(60 / 120 只是示例, 按设备实际能固定的档位填)。
#   matrix.sh 一次调用只跑一个刷新率(--hz): 一台设备配了多档时, 每档单独调用一次, 之间手动切好刷新率;
#   启动前会核对 Android 的屏幕刷新率, 和这里不一致就整体退出。
#   高刷档只给「开了就一直高刷」的机型配: 先在开发者选项「显示刷新率」悬浮窗确认; 只在手指触摸时才升频的机型,
#   自动化手势不会触发升频, 高刷数据等于 60Hz, 只配 60。只对白名单游戏开放的档位(如 165Hz)普通 App 用不到, 不测;
# - backend: impeller 或 skia; skia 只用于 Android。matrix.sh 默认只跑 impeller 行, --backend skia|all 才跑 skia 行。
#
# 新增设备: 追加它的组合行即可。

ios-phone   IOS_PHONE_ID          60   impeller

# 只在触摸时升频的 Android: 只配 60。
android-a   ANDROID_A_ID          60   impeller

# 一直高刷的 Android: 60 与 120 各调用一次 matrix.sh。
android-b   ANDROID_B_ID          60   impeller
android-b   ANDROID_B_ID          120  impeller
android-b   ANDROID_B_ID          120  skia
