# matrix.sh 的设备清单: 复制为同目录的 devices.conf(不入库), 把占位符换成设备 id(`fvm flutter devices` 第二列)。
#
# 每行一个组合: <label> <device-id> <hz> <backend>
# - label: 结果目录里的设备名, 小写字母、数字与连字符;
# - hz: 采集前在手机上固定的刷新率(下面的 60 / 120 只是示例, 按设备实际支持的档位填); 同一台设备的不同 hz 分阶段跑, 阶段之间脚本会暂停让你切换;
#   高刷档以系统设置里能固定的档位为准, 只对白名单游戏开放的档位(如部分机型的 165Hz)普通 App 用不到, 不测;
# - backend: impeller 或 skia; skia 只用于 Android, 每台 Android 只在最高档测一组。
#
# 新增设备: 追加它的组合行即可。

ios-phone   IOS_PHONE_ID          60   impeller

android-a   ANDROID_A_ID          60   impeller
android-a   ANDROID_A_ID          120  impeller
android-a   ANDROID_A_ID          120  skia

android-b   ANDROID_B_ID          60   impeller
android-b   ANDROID_B_ID          120  impeller
android-b   ANDROID_B_ID          120  skia
