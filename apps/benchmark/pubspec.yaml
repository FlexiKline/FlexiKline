resolution: workspace
name: flexi_kline_benchmark
description: "FlexiKline on-device frame benchmark (L3): build / raster frame times on real devices."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 必须容纳对照基线 v2.5.6-monorepo; workspace 内解析到本地包。
  flexi_kline: '>=2.5.6 <3.0.0'
  # draw 场景用真实绘图工具; 基线上是 2.0.1。
  flexi_kline_draw_tools: '>=2.0.1 <3.0.0'
  flexi_formatter: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: true
