# matrix.sh 的设备清单: 复制为 devices.conf(不入库)后填入设备 id(`fvm flutter devices` 第二列)。
#
# 每行一个组合: <label> <device-id> <hz> <backend>
# - label: 结果目录里的设备名, 小写字母、数字与连字符;
# - hz: 采集前在手机上固定的刷新率; 同一台设备的不同 hz 分阶段跑, 阶段之间脚本会暂停让你切换;
# - backend: impeller 或 skia; skia 只用于 Android, 每台 Android 只在最高档测一组。
#
# 新增设备: 追加它的组合行即可。

iphone16    IPHONE16_DEVICE_ID          60      impeller

oneplus15t  ONEPLUS_DEVICE_ID           60      impeller
oneplus15t  ONEPLUS_DEVICE_ID           165     impeller
oneplus15t  ONEPLUS_DEVICE_ID           165     skia

honor80pro  HONOR_DEVICE_ID             60      impeller
honor80pro  HONOR_DEVICE_ID             120     impeller
honor80pro  HONOR_DEVICE_ID             120     skia
